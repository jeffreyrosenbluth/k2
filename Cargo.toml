[package]
name = "k2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
eframe = "0.36"
egui = { version = "0.36", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wassily = { git = "https://github.com/jeffreyrosenbluth/wassily" }
rand = { version = "0.9", features = ["small_rng"] }
directories = "6.0"
env_logger = "0.11"
rayon = "1.10"

# Keep the app responsive in debug builds: optimize all dependencies
# (tiny-skia, noise, iced) fully, and this crate's code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
