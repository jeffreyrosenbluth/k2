[package]
name = "k2"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
iced = { version = "0.14", features = ["image", "tokio", "lazy"] }
wassily = { git = "https://github.com/jeffreyrosenbluth/wassily" }
rand = { version = "0.9", features = ["small_rng"] }
num-traits = "0.2"
iced_aw = { version = "0.14", default-features = false, features = [
    "color_picker",
] }
directories = "6.0"
env_logger = "0.11"
rayon = "1.10"

# Keep the app responsive in debug builds: optimize all dependencies
# (tiny-skia, noise, iced) fully, and this crate's code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
